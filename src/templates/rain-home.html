<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>一场雨 · Mizuki</title>
  <style>
    @font-face { font-family: WenKai; src: local("LXGW WenKai"), local("LXGW WenKai Regular"), url("/portfolio/assets/fonts/LXGWWenKai-Regular.ttf") format("truetype"); font-display: swap; }
    :root { color-scheme: dark; --ink: #f2f2e8; --quiet: #c1cfce; --edge: #c3dbd155; --night: #0d171d; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--night); color: var(--ink); font: 16px/1.65 WenKai, "Microsoft YaHei", sans-serif; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; cursor: pointer; }
    a:focus-visible, button:focus-visible { outline: 2px solid #c7e6e2; outline-offset: 5px; }
    [hidden] { display: none !important; }
    .journey { height: calc(575svh + var(--sunbreak-span, 0svh)); }
    .stage { position: sticky; top: 0; height: 100svh; min-height: 320px; overflow: hidden; isolation: isolate; touch-action: pan-y pinch-zoom; background: radial-gradient(ellipse at 66% 54%, #5d7580, #101724 80%); }
    .stage canvas, .stage::before { position: absolute; inset: 0; width: 100%; height: 100%; }
    .stage::before { content: ""; z-index: 1; pointer-events: none; background: linear-gradient(90deg,#0c131dce 0%,#0c131d70 35%,transparent 69%),linear-gradient(0deg,#0a1018cb 0%,transparent 32%,transparent 80%,#0b141a73); }
    .sr-only { position: absolute; width: 1px; height: 1px; clip-path: inset(50%); overflow: hidden; white-space: nowrap; }
    .mast, .story, .travel { position: absolute; z-index: 3; }
    .story[hidden] { display: block !important; visibility: hidden; pointer-events: none; }
    .mast, .travel { left: clamp(18px,5vw,84px); right: clamp(18px,5vw,84px); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .mast { top: clamp(14px,4.2svh,48px); }
    .brand { display: inline-flex; align-items: center; gap: 9px; font-size: .94rem; }
    .brand-mark { border: 1px solid #d6e7dc80; border-radius: 50%; width: 32px; height: 32px; display: inline-grid; place-items: center; }
    .tools { display: flex; align-items: center; gap: clamp(12px,3.5vw,32px); }
    .tools button, .tools a { background: transparent; border: none; padding: 5px 0; font-size: .8rem; color: var(--quiet); white-space: nowrap; }
    .tools button:hover, .tools a:hover { color: var(--ink); }
    .story { --current: #badce5; left: clamp(20px,9vw,145px); top: 49%; transform: translateY(-42%); width: min(34vw,375px); text-shadow: 0 2px 15px #0a1420; }
    .story[data-chapter="1"] { --current: #c4ddf2; }
    .story[data-chapter="2"] { --current: #e7dbb7; }
    .story[data-chapter="3"] { --current: #bce3d9; }
    .passage { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 5px 18px; padding: 15px 0; border-block: 1px solid var(--edge); }
    .passage h2 { grid-column: 1; margin: 0; font-weight: 400; font-size: clamp(2.1rem,4.7vw,4.6rem); line-height: 1.12; letter-spacing: .04em; }
    .passage p { grid-column: 1; margin: 0; color: #e2e7de; font-size: clamp(.88rem,1.26vw,1.12rem); }
    .passage-arrow { grid-area: 1 / 2 / 3; width: 46px; height: 46px; display: grid; place-items: center; border: 1px solid var(--edge); border-radius: 50%; color: var(--current); font: 1.32rem/1 system-ui,sans-serif; transition: transform .22s, background .22s, border-color .22s; }
    .passage:is(:hover,:focus-visible) .passage-arrow { transform: translateX(4px); background: #b9dfdf24; border-color: var(--current); }
    @media (prefers-reduced-motion: reduce) {
      .passage-arrow { transition: none; }
      .passage:is(:hover,:focus-visible) .passage-arrow { transform: none; }
    }
    .column-nav { position:absolute; z-index:4; right:clamp(18px,4vw,65px); top:50%; transform:translateY(-50%); display:grid; gap:.1rem; text-align:right; border-right:1px solid #e3eeee69; }
    .column-nav a { display:block; padding:.36rem .72rem; border-right:2px solid transparent; margin-right:-1px; color:#edf4ef; text-shadow:0 1px 4px #091722,0 0 10px #091722; font-size:.88rem; }
    .column-nav a:is(:hover,[aria-current]) { border-color:#e8ddbb; color:#fff4d5; }
    .story[data-chapter="2"] .passage h2 { transform:scale(var(--copy-scale,1)); transform-origin:left bottom; }
    .story[data-chapter="2"] .passage p { opacity:var(--copy-quiet,1); }
    .story[data-chapter="2"] .passage-arrow { opacity:max(.55,var(--copy-quiet,1)); }
    .drag-zone { position:absolute; z-index:2; left:var(--drag-left,53%); top:var(--drag-top,25%); width:var(--drag-width,28%); height:var(--drag-height,45%); cursor:grab; touch-action:pan-y pinch-zoom; }
    .drag-zone[data-dragging] { cursor:grabbing; }
    @media (max-width:740px) { .column-nav { top:4.5rem; right:18px; transform:none; grid-auto-flow:column; gap:.22rem; border-right:0; border-bottom:1px solid #e3eeee69; } .column-nav a { font-size:.78rem; padding:.50rem .46rem; border-right:0; border-bottom:2px solid transparent; margin:0 0 -1px; } }
    @media (prefers-reduced-motion:reduce) { .journey { height:100svh; } }
    .rain-loader progress:indeterminate { appearance:auto; accent-color:#c4e9ed; }
    .rain-skip { display:inline-block; margin-top:.55rem; padding:.25rem .7rem; border:1px solid var(--edge); border-radius:4px; font-size:.8rem; }
    .travel { bottom: clamp(12px,3.8svh,40px); }
    .travel nav { display: flex; align-items: center; gap: clamp(10px,2.4vw,32px); }
    .travel nav a { color: #c0d0d1; padding: 4px 1px; font-size: .81rem; white-space: nowrap; }
    .travel nav a[aria-current] { color: #f5f5eb; border-bottom: 1px solid #e6dfb8; }
    .travel progress { appearance: none; width: clamp(55px,12vw,166px); height: 2px; border: 0; background: #c3dbd14a; }
    .travel progress::-webkit-progress-bar { background: #c3dbd14a; }
    .travel progress::-webkit-progress-value { background: #d9ebdf; }
    .travel progress::-moz-progress-bar { background: #d9ebdf; }
    .rain-exit { position: fixed; inset: 0; z-index: 20; overflow: hidden; outline: none; touch-action: none; }
    .rain-exit canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .rain-loader { position: absolute; top: 64%; left: 50%; width: min(62vw,450px); transform: translateX(-50%); text-align: center; }
    .rain-loader progress { display: block; width: 100%; height: 2px; appearance: none; border: none; background: #a8cfd249; }
    .rain-loader progress::-webkit-progress-bar { background: #a8cfd249; }
    .rain-loader progress::-webkit-progress-value { background: #c4e9ed; }
    .rain-loader progress::-moz-progress-bar { background: #c4e9ed; }
    .rain-loader p { margin: 13px 0 0; font-size: .84rem; letter-spacing: .16em; color: #d8eff1; text-shadow: 0 2px 6px #0b1924; }
    @media (max-width: 740px) {
      .stage::before { background: linear-gradient(0deg,#0a1018ed, #0a101851 33%,transparent 64%,#0a1018a0); }
      .story { top: auto; bottom: max(65px,10svh); left: 20px; transform: none; width: min(calc(100% - 40px),375px); }
      .story[data-chapter="3"] { top: 22%; bottom: auto; }
      .passage { padding-block: 10px; }
      .passage h2 { font-size: clamp(1.85rem,8.3vw,3.3rem); }
      .passage-arrow { width: 42px; height: 42px; }
      .travel nav { gap: clamp(9px,3.6vw,23px); }
      .travel nav a { font-size: .77rem; }
      .travel progress { width: min(18vw,90px); }
    }
    @media (max-height: 520px) and (min-width: 741px) {
      .story { top: 40%; }
      .passage h2 { font-size: clamp(2rem,5vw,4rem); }
    }
    @media (max-width: 380px) { .mast, .tools { gap: 8px; } .tools button, .tools a { font-size: .74rem; } }

  <script>
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const stage = document.querySelector('.stage');
    const journey = document.querySelector('.journey');
    const progress = document.querySelector('progress');
    const panels = [...document.querySelectorAll('.story')];
    const columnLinks = [...document.querySelectorAll('.column-nav a')];
    const tabs = [...document.querySelectorAll('.travel [data-seek]')];
    const sound = document.querySelector('#sound');
    const ambient = document.querySelector('#ambient');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)');
    const { createPointerField, openingCamera, projectOpeningRain, projectRain } = window.RainSpace;
    const field = createPointerField();
    const dropSurface = window.createLiquidSurface();
    const bellSurface = window.createLiquidSurface();
    const look = { yaw: 0, pitch: 0, targetYaw: 0, targetPitch: 0 };
    const clamp = x => Math.max(0, Math.min(1, x));
    const mix = (a, b, t) => a + (b - a) * t;
    const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
    const color = (a, b, t) => `rgb(${a.map((n, i) => Math.round(mix(n, b[i], t))).join(' ')})`;
    const tau = 2 * Math.PI;

    function seeded(seed) {
      return () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
    }

    const random = seeded(1093);
    const makeOffsets = () => ({ offsetX: 0, offsetY: 0, vx: 0, vy: 0 });
    const rain = Array.from({ length: 492 }, (_, index) => ({
      x: random(), y: random(), depth: index < 32 ? .72 + random() * .44 : 1.16 + random() * 2.0,
      speed: random(), light: random(), angle: random() * tau, ...makeOffsets(),
    }));
    const impactAt = .862;
    const chimeAt = .677;
    const particleSamples = window.rainParticles;
    const bellTipRatio = particleSamples?.bellTip ?? .931;
    const bellPivot = particleSamples?.bellPivot ?? .31;
    const trajectories = Array.from({ length: particleSamples?.drop.length ?? 0 }, () => ({
      angle: random() * tau, distance: random() ** .65, curl: random(), delay: random() * .20,
      size: .39 + random() ** 2.2 * 1.32, glint: random(), ...makeOffsets(),
    }));
    function makeSpray(samples) {
      return (samples ?? []).filter((_, index) => index % 8 === 0).map(([x, y, r, g, b, depth], index) => ({
        index: index * 8, u: x / 255, v: y / 255, color: `rgb(${r},${g},${b})`,
        radius: .55 + random() * 1.10, angle: random() * tau, depth, ...makeOffsets(),
      }));
    }
    const dropSpray = makeSpray(particleSamples?.drop);
    const bellSpray = makeSpray(particleSamples?.bell);
    const waterTouches = [];
    let width = 0, height = 0, pixelRatio = 1, frame = 0, chapter = -1, lastProgress = 0;
    let ambientPaused = false, ambientTime = 0, clockAt = null, paintedAt = -Infinity, paintedProgress = null, dirty = true;
    let simulatedAt = 0, cameraProgress = null, frameAt = null;

    function loadPlate(path) {
      const image = new Image();
      image.addEventListener('load', requestFrame);
      image.src = '/rain/' + path;
      return image;
    }

    const cloudPlate = loadPlate('cloud.webp');
    const cloudDescent = Array.from({ length: 27 }, (_, index) =>
      loadPlate(`cloud-sea/${String(1 + 4 * index).padStart(3, '0')}.webp`));
    const waterPlate = loadPlate('pool.webp');
    const dropPlate = loadPlate('drop-water.webp');
    const bellPlate = loadPlate('bell-water.webp');
    const dropViews = window.createWaterViews('drop', dropPlate, 540, 500, requestFrame);
    const bellViews = window.createWaterViews('bell', bellPlate, 476, 702, requestFrame);

    const cloudWisps = loadPlate('cloud-wisp.webp');
    const sheen = document.createElement('canvas');
    sheen.width = 540;
    sheen.height = 500;
    const sheenContext = sheen.getContext('2d');

    function createMist() {
      const tile = document.createElement('canvas');
      tile.width = 480;
      tile.height = 140;
      const brush = tile.getContext('2d');
      if (!brush) return tile;
      const plumes = [
        [74, 87, 65, 27, .15], [153, 74, 94, 35, .16], [236, 68, 108, 41, .21],
        [291, 66, 79, 39, .20], [370, 83, 104, 28, .14],
      ];
      for (const [x, y, w, h, alpha] of plumes) {
        brush.save();
        brush.translate(x, y);
        brush.scale(w, h);
        const mist = brush.createRadialGradient(0, 0, .06, 0, 0, 1);
        mist.addColorStop(0, `rgba(185,203,204,${alpha})`);
        mist.addColorStop(.44, `rgba(159,182,192,${alpha * .62})`);
        mist.addColorStop(1, 'rgba(131,160,175,0)');
        brush.fillStyle = mist;
        brush.fillRect(-1, -1, 2, 2);
        brush.restore();
      }
      return tile;
    }
    const cloudScene = window.CloudSpace.createCloudScene(cloudWisps, createMist());
    const cloudWind = window.createCloudWind();
    const waterLens = window.createWaterLens();

    function paintPlate(plate, opacity, zoom, focalX, focalY, {
      driftX = 0, driftY = 0, disturbance = 0, phase = 0,
      target = ctx, viewportWidth = width, viewportHeight = height, cameraRatio = width < 741 ? .53 : .67,
    } = {}) {
      if (opacity <= 0 || !plate.naturalWidth) return;
      const width = viewportWidth, height = viewportHeight, ctx = target;
      const scale = Math.max(width / plate.naturalWidth, height / plate.naturalHeight) * zoom;
      const dw = plate.naturalWidth * scale;
      const dh = plate.naturalHeight * scale;
      const cameraX = width * cameraRatio;
      const dx = Math.min(0, Math.max(width - dw, cameraX - dw * focalX + driftX));
      const dy = Math.min(0, Math.max(height - dh, (height - dh) * focalY + driftY));
      ctx.save();
      ctx.globalAlpha = opacity;
      if (!disturbance) {
        ctx.drawImage(plate, dx, dy, dw, dh);
      } else {
        const waterY = height * .50;
        const split = (waterY - dy) / scale;
        ctx.drawImage(plate, 0, 0, plate.naturalWidth, split, dx, dy, dw, waterY - dy);
        const strip = 6;
        for (let y = waterY; y < height; y += strip) {
          const sourceY = (y - dy) / scale;
          const sourceHeight = Math.min(strip / scale, plate.naturalHeight - sourceY);
          const depth = (y - waterY) / (height - waterY);
          const offset = Math.sin(depth * 35 - phase) * disturbance * Math.sin(depth * Math.PI);
          if (sourceHeight > 0) ctx.drawImage(plate, 0, sourceY, plate.naturalWidth, sourceHeight,
            dx + offset, y, dw, sourceHeight * scale + .25);
        }
      }
      ctx.restore();
    }

    function paintCloudDescent(p, time, zoom = 1.025, blur = 0) {
      const position = clamp(p / .35) * (cloudDescent.length - 1);
      const index = Math.floor(position);
      const previous = cloudDescent[index];
      const next = cloudDescent[Math.min(index + 1, cloudDescent.length - 1)];
      const ready = plate => plate.complete && plate.naturalWidth > 0;
      const base = ready(previous) ? previous : ready(next) ? next : cloudDescent[0];
      if (!ready(base)) return false;
      const focalX = width < 741 ? .56 : .66;
      const following = base !== next && ready(next) ? next : null;
      const blend = following ? position - index : 0;
      const draw = (target, viewportWidth, viewportHeight) => {
        const frame = { target, viewportWidth, viewportHeight };
        paintPlate(base, 1, zoom, focalX, .55, frame);
        if (following) paintPlate(following, blend, zoom, focalX, .55, frame);
      };
      ctx.save();
      if (blur > .1) {
        const overscan = blur * 2.6;
        ctx.translate(-overscan, -overscan);
        ctx.scale(1 + overscan * 2 / width, 1 + overscan * 2 / height);
        ctx.filter = `blur(${blur}px)`;
      }
      if (reduced.matches || !cloudWind.paint(ctx, width, height, p, time, base, following, blend, zoom, draw)) draw(ctx, width, height);
      ctx.restore();
      return true;
    }

    function paintSky(p) {
      const opening = smooth(.14, .58, p);
      const evening = smooth(.67, .94, p);
      const skyTop = opening < 1 ? color([13, 20, 38], [41, 64, 87], opening) : color([41, 64, 87], [19, 40, 56], evening);
      const skyBottom = opening < 1 ? color([67, 91, 109], [142, 173, 175], opening) : color([142, 173, 175], [212, 169, 124], evening);
      const sky = ctx.createLinearGradient(0, 0, 0, height * .96);
      sky.addColorStop(0, skyTop);
      sky.addColorStop(.57, color([71, 91, 112], [101, 144, 153], opening));
      sky.addColorStop(1, skyBottom);
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, width, height);
      const lx = width * .69, ly = height * mix(.31, .47, evening);
      const light = ctx.createRadialGradient(lx, ly, 0, lx, ly, Math.max(width, height) * .55);
      light.addColorStop(0, `rgba(249,230,193,${.18 + opening * .32})`);
      light.addColorStop(.32, 'rgba(181,222,217,.15)');
      light.addColorStop(1, 'rgba(130,179,203,0)');
      ctx.fillStyle = light;
      ctx.fillRect(0, 0, width, height);
    }

    function paintRain(p, time, dt, close, camera, centerX, centerY) {
      const curtain = 1 - smooth(.11, .225, p);
      const opacity = mix(.27, 1, curtain) * (1 - smooth(.72, .85, p));
      if (!opacity) return;
      ctx.save();
      if (curtain > .02) {
        const veil = ctx.createLinearGradient(0, height, width, 0);
        veil.addColorStop(0, '#42667c0b');
        veil.addColorStop(.42, '#29475638');
        veil.addColorStop(.73, '#789bab29');

    function requestFrame() {
      dirty = true;
      if (!frame && !document.hidden) frame = requestAnimationFrame(render);
    }
    function resize() {
      width = stage.clientWidth;
      height = stage.clientHeight;
      pixelRatio = Math.min(devicePixelRatio || 1, 1.8);
      canvas.width = Math.round(width * pixelRatio);
      canvas.height = Math.round(height * pixelRatio);
      requestFrame();
    }
    const jumps = [...document.querySelectorAll('[data-seek]')];
    function seek(position, instant) {
      if (reduced.matches) {
        staticChapter = still.indexOf(position);
        scrollTo({top: 0, behavior: 'instant'});
        requestFrame();
        return;
      }
      const top = journey.getBoundingClientRect().top + scrollY + position * distance();
      if (instant) cameraProgress = null;
      scrollTo({ top, behavior: instant || reduced.matches ? 'instant' : 'smooth' });
      requestFrame();
    }
    jumps.forEach(link => link.addEventListener('click', event => {
      if (event.button > 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      seek(Number(link.dataset.seek), false);
    }));
    addEventListener('resize', resize);
    addEventListener('scroll', requestFrame, { passive: true });
    function pointOnStage(event) {
      const bounds = stage.getBoundingClientRect();
      return { x: event.clientX - bounds.left, y: event.clientY - bounds.top };
    }
    function aimAt(x, y) {
      const midpoint = width * (width < 741 ? .53 : .67);
      look.targetYaw = .24 * signed((x - midpoint) / Math.max(1, width * .30));
      look.targetPitch = .24 * signed((height * .44 - y) / Math.max(1, height * .33));
    }
    stage.addEventListener('pointermove', event => {
      if (ambientPaused || reduced.matches) return;
      const { x, y } = pointOnStage(event);
      if (drag?.id === event.pointerId) {
        look.targetYaw = signed(drag.yaw + (x - drag.x) / 110);
        look.targetPitch = signed(drag.pitch - (y - drag.y) / 105);
      } else if (event.pointerType !== 'touch') aimAt(x, y);
      else return;
      if (lastProgress >= .88 && y > height * .5 &&
          (!lastWake || (ambientTime - lastWake.time > .16 && Math.hypot(x - lastWake.x, y - lastWake.y) > 23))) {
        lastWake = {x, y, time: ambientTime};
        addWake(x, y, .32);
      }
      field.move(x, y);
      cloudScene.stir(x, y, ambientTime);
    }, { passive: true });
    function addWake(x,y,strength) {
      if (waterTouches.length >= 7) waterTouches.shift();
      waterTouches.push({x:x/width,y:y/height,time:ambientTime,strength});
    }
    function finishDrag() {
      if (!drag) return;
      const id = drag.id;
      drag = null;
      delete zone.dataset.dragging;
      if (zone.hasPointerCapture(id)) zone.releasePointerCapture(id);
      look.targetYaw = look.targetPitch = 0;
    }
    zone.addEventListener('lostpointercapture', finishDrag);
    zone.addEventListener('pointerdown', event => {
      if (event.button !== 0 || drag || ambientPaused || reduced.matches) return;
      const {x,y} = pointOnStage(event);
      drag = {id:event.pointerId,x,y,yaw:look.yaw,pitch:look.pitch};
      zone.setPointerCapture(event.pointerId);
      zone.dataset.dragging = '';
    });
    function leaveStage() {
      finishDrag();
      look.targetYaw = look.targetPitch = 0;
      field.leave();
      cloudScene.leave();
    }
    stage.addEventListener('pointerleave', leaveStage);
    stage.addEventListener('pointercancel', leaveStage);
    stage.addEventListener('pointerup', event => {
      finishDrag();
    });
    stage.addEventListener('pointerdown', event => {
      if (event.button > 0 || ambientPaused || reduced.matches || event.target.closest?.('a, button')) return;
      const { x, y } = pointOnStage(event);
      if (event.pointerType === 'touch') {
        aimAt(x, y);
        field.move(x, y, true);
        cloudScene.stir(x, y, ambientTime, true);
      }
      if (lastProgress >= .88 && y > height * .42) addWake(x, y, 1);
    }, { passive: true });
    ambient.addEventListener('click', () => {
      ambientPaused = !ambientPaused;
      clockAt = null;
      leaveStage();
      if (ambientPaused) zone.hidden = true;
      ambient.textContent = ambientPaused ? '恢复环境' : '暂停环境';
      ambient.setAttribute('aria-pressed', String(ambientPaused));
      requestFrame();
    });
    document.addEventListener('visibilitychange', () => {
      clockAt = null;
      if (document.hidden) {
        leaveStage();
        if (frame) cancelAnimationFrame(frame);
        frame = 0;
      } else requestFrame();
    });
    function updateMotionPreference() {
      clockAt = null;
      ambient.hidden = reduced.matches || !ctx;
      if (reduced.matches) { leaveStage(); zone.hidden = true; }
      requestFrame();
    }
    reduced.addEventListener('change', updateMotionPreference);
    const departure = window.createRainDeparture({
      overlay: document.querySelector('#rain-exit'),
      content: document.querySelector('#rain-page'),
      reduced,
      getWater() {
        const stageVisible = stage.getBoundingClientRect().bottom > stage.clientHeight * .8;
        if (stageVisible && lastProgress > .21 && lastProgress < .42) {
          const center = {}, bottom = {};
          dropSurface.project(.5, .5, center);
          dropSurface.project(.5, 1, bottom);
          return { source: dropPlate, points: particleSamples?.drop, ...center,
            height: Math.hypot(bottom.x - center.x, bottom.y - center.y) * 2 };
        }
        if (stageVisible && lastProgress > .64 && lastProgress < .86) {
          const center = {}, bottom = {};
          bellSurface.project(.5, .5, center);
          bellSurface.project(.5, 1, bottom);
          return { source: bellPlate, points: particleSamples?.bell, ...center,
            height: Math.hypot(bottom.x - center.x, bottom.y - center.y) * 2 };
        }
        return { source: bellPlate, points: particleSamples?.bell };
      },
      onStateChange(active) {
        if (active) leaveStage();
        requestFrame();
      },
    });
    addEventListener('pagehide', () => {
      try { history.replaceState({...history.state, rainY:scrollY, staticChapter}, ''); } catch {}
    });
    addEventListener('pageshow', event => {
      const state = history.state;
      if (state && typeof state.rainY === 'number') {
        staticChapter = state.staticChapter ?? 0;
        if (!event.persisted) scrollTo({top: state.rainY, behavior:'instant'});
        requestFrame();
      }
    });
    updateMotionPreference();
    resize();
  </script>
</body>
</html>
