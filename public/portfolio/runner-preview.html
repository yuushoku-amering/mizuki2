<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雨铃 · Q版跑步预览</title><link rel="stylesheet" href="runner.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f2;color:#4f5a55;font:13px/1.8 'Microsoft YaHei',sans-serif}header{max-width:980px;margin:0 auto;padding:25px 30px;border-bottom:1px solid #5b66571e;display:flex;justify-content:space-between;align-items:center}a{color:#7e8c7b;text-decoration:none;font-size:11px}.brand{font:18px Georgia,serif;letter-spacing:4px;color:#505d51}main{max-width:980px;margin:55px auto;padding:0 30px}.eyebrow{font:10px Georgia,serif;letter-spacing:3px;color:#a28a93}h1{font:32px/1.6 'SimSun',serif;font-weight:400;letter-spacing:3px;margin:12px 0}main>p{font-size:12px;color:#9aa191}.stage{margin-top:30px;border-radius:8px;min-height:390px;display:flex;align-items:center;justify-content:center;gap:90px;transition:background .5s;background:#e7d3df}.stage.autumn{background:#e7d8b9}.stage.winter{background:#d6e3eb}.large,.small{text-align:center}.large .runner{width:210px;height:280px}.small .runner{width:90px;height:120px}.stage p{font-size:10px;color:#65716c;letter-spacing:1px}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0}button{border:1px solid #5b66572b;background:transparent;color:#74816e;border-radius:30px;padding:7px 18px;font:11px 'Microsoft YaHei';cursor:pointer}button[aria-pressed=true]{background:#e5e9df;border-color:#a4b19a}.paused .oc-runner{animation-play-state:paused}.note{font-size:11px;color:#9ba28f;border-top:1px solid #5b66571e;padding-top:22px}.note a{border-bottom:1px solid #9ba28f66}button:focus-visible,a:focus-visible{outline:2px solid #a08290;outline-offset:4px}@media(max-width:600px){main{margin-top:35px;padding:0 20px}header{padding:20px}.stage{gap:10px;min-height:350px}.large .runner{width:168px;height:224px}.small .runner{width:72px;height:96px}h1{font-size:26px}.controls{gap:7px}button{padding:7px 12px}}
</style><link rel="stylesheet" href="experience.css"><link rel="stylesheet" href="font.css"></head><body><header><span class="brand">MIZUKI</span><a href="index.html">← 返回季节树</a></header><main><span class="eyebrow">YUUSHOKU AMERING / RUN CYCLE</span><h1>雨铃，跑过三个季节。</h1><p>日常装 · 银白粉梢长发 · 蓝瞳 · 雨痕发束与白瓷铃</p><section class="stage" aria-label="八帧跑步循环预览"><div class="large"><div class="runner"><div class="oc-runner" role="img" aria-label="放大版Q版雨铃跑步动画"></div></div><p>角色细节预览</p></div><div class="small"><div class="runner"><div class="oc-runner" role="img" aria-label="小尺寸Q版雨铃跑步动画"></div></div><p>小尺寸效果</p></div></section><div class="controls" role="group" aria-label="动画背景与播放"><button data-season="spring" aria-pressed="true">春 · 樱花</button><button data-season="autumn" aria-pressed="false">秋 · 银杏</button><button data-season="winter" aria-pressed="false">冬 · 雪梅</button><button id="pause" aria-pressed="false">暂停动画</button></div><div class="note">树与季节钟盘保持代码绘制；此角色用于项目预览的加载转场。<br><a href="index.html">回到季节树，双击花朵体验实际转场 ↗</a></div></main><script>
const stage=document.querySelector('.stage');document.querySelectorAll('[data-season]').forEach(b=>b.onclick=()=>{stage.className='stage '+(b.dataset.season==='spring'?'':b.dataset.season);document.querySelectorAll('[data-season]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});const p=document.querySelector('#pause');p.onclick=()=>{const paused=document.body.classList.toggle('paused');p.setAttribute('aria-pressed',String(paused));p.textContent=paused?'继续播放':'暂停动画';};if(matchMedia('(prefers-reduced-motion: reduce)').matches){document.body.classList.add('paused');p.setAttribute('aria-pressed','true');p.textContent='继续播放';}
</script></body></html>
